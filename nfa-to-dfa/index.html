<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>DFA変換ツール</title>
    <link rel="stylesheet" href="../shared/styles.css" />
  </head>
  <body>
    <h2>オートマトン状態遷移表</h2>
    <div style="margin: 16px 0px">
      <button id="add_state_button">状態追加</button>
      <button id="add_symbol_button">入力記号追加</button>
    </div>

    <div id="editable"></div>

    <div style="margin: 16px 0px">
      <button id="convert">変換</button>
    </div>

    <p>DFA:</p>
    <div id="converted"></div>

    <p>最簡形DFA:</p>
    <div id="minimized"></div>

    <script type="module" src="script.js"></script>
  </body>
</html>
